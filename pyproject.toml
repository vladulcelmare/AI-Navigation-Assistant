[project]
name = "ai-powered-in-car-assistant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=1.0.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
